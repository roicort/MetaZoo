site_name: MetaZoo Docs
site_url: https://github.com/roicort/MetaZoo
repo_url: https://github.com/roicort/MetaZoo
repo_name: roicort/MetaZoo
docs_dir: src
theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Roboto
    code: Fira Mono
  logo: assets/logo.svg
extra_css:
  - assets/custom.css
nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Modules:
    - Bio:
      - Overview: bio.md
      - Evolutionary:
        - Overview: evolutionary.md
        - Genetic Algorithm: ga.md
        - Operators: evolutionary/operators.md
    - Gym:
      - Overview: gym.md
      - Mono: gym/mono.md
  - PettingZoo: pettingzoo.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            extra:
              show_root_toc_entry: true
              show_source: true
              docstring_style: google
              separate_signature: true
              show_if_no_docstring: true
              show_private_members: true
              show_special_members: true
              members_order: alphabetical
              filters:
                - "!^_.*"
